[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
# Check https://flit.readthedocs.io/en/latest/pyproject_toml.html for all available sections
name = "ansys-cfx-api"
version = "0.1.dev0"
description = "A Python wrapper for the Ansys CFX API."
readme = "README.rst"
requires-python = ">=3.9,<4"
license = {file = "LICENSE"}
authors = [
    {name = "ANSYS, Inc.", email = "pyansys.support@ansys.com"},
]
maintainers = [
    {name = "PyAnsys developers", email = "pyansys.core@ansys.com"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "importlib-metadata >=4.0",
]

[project.optional-dependencies]
tests = [
    "pytest==8.0.2",
    "pytest-cov==4.1.0",
]
doc = [
    "ansys-sphinx-theme==0.14.0",
    "numpydoc==1.6.0",
    "sphinx==7.2.6",
    "sphinx-copybutton==0.5.2",
]


[tool.flit.module]
name = "ansys.cfx.api"

[project.urls]
Source = "https://github.com/ansys-internal/ansys-api-cfx"
Tracker = "https://github.com/ansys-internal/ansys-api-cfx/issues"
Homepage = "https://github.com/ansys-internal/ansys-api-cfx"


[tool.black]
line-length = 100

[tool.isort]
profile = "black"
force_sort_within_sections = true
line_length = 100
default_section = "THIRDPARTY"
src_paths = ["doc", "src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=ansys.cfx.api"]
markers = [
    "Pre : Tests that instantiate a pypre_core.PyPre object",
    "Post : Tests that instantiate a pypost_core.PyPost object",
]

[tool.coverage.run]
source = ["src/ansys/cfx"]

[tool.coverage.report]
show_missing = true
omit = [
    # not used yet:
    #   <no files to list here>
    # abstract interfaces
    "src/ansys/cfx/api/CCL/*_interface.py",
]

[tool.pydocstyle]
add-ignore = ["D400"]


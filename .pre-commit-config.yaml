repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: ce4bd7270237e95464b37d808b942f02785192c4  # frozen: v23.1.5
    hooks:
      - id: clang-format
        files: ^.+.proto$
        args: [-i, -style=file]

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["-L", "Synopsys,synopsys"]

  - repo: https://github.com/yoheimuta/protolint
    rev: c5433e2d6826441fc6150e7eb0ff5ad568100ad5  # frozen: v0.58.0
    hooks:
      - id: protolint

  - repo: https://github.com/ansys/pre-commit-hooks
    rev: dbcd0a4ad0060f78ac3c7d53d342f510edc48eab  # frozen: v0.8.1
    hooks:
      - id: add-license-headers
        files: '(src/|setup).*(\.py|\.proto)$'
        args:
          - --start_year=2023
          - --custom_license=Apache-2.0
